<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>尚礼记</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", sans-serif;
      background: #f6f2eb;
      color: #17202d;
      line-height: 1.7;
    }
    header, main, footer { max-width: 720px; margin: 0 auto; padding: 32px 20px; }
    header { padding-top: 56px; }
    .mark {
      width: 72px; height: 72px; border-radius: 18px;
      background: #17202d; color: #f6f2eb;
      display: grid; place-items: center;
      font-size: 36px; font-weight: 600;
    }
    h1 { font-size: 40px; line-height: 1.2; margin: 20px 0 8px; }
    .lead { font-size: 18px; color: #3d4654; margin: 0; }
    section { background: #fffdf9; border-radius: 20px; padding: 20px 22px; margin: 16px 0; }
    h2 { font-size: 18px; margin: 0 0 8px; }
    ul { margin: 0; padding-left: 18px; }
    a { color: #9a3412; }
    footer { color: #6b7280; font-size: 14px; }
  </style>
</head>
<body>
  <header>
    <div class="mark">礼</div>
    <h1>尚礼记</h1>
    <p class="lead">把每一笔人情往来记在自己的手机里。</p>
  </header>
  <main>
    <section>
      <h2>用来记什么</h2>
      <p>婚礼、乔迁、生日、节日的礼金，都可以放进独立账簿。打开一个联系人，就能看到双方的收礼、送礼、差额和历史。</p>
    </section>
    <section>
      <h2>数据在你自己手里</h2>
      <p>不需要注册账号。礼账默认只保存在这台设备上。可以导出 Excel 或 PDF，也可以把自己的 WebDAV 地址配进去，做整包备份。</p>
    </section>
    <section>
      <h2>可以做的事</h2>
      <ul>
        <li>记录收礼和送礼，包含金额、联系人、事由、日期和备注</li>
        <li>按场景分开多个账簿</li>
        <li>用拼音索引查找联系人，查看往来差额</li>
        <li>按月、年或自定义时段查看统计</li>
        <li>同时看公历和农历</li>
      </ul>
    </section>
  </main>
  <footer>
    <p>需要帮助请看 <a href="support.html">技术支持</a>。数据处理方式见 <a href="privacy.html">隐私政策</a>。</p>
  </footer>
</body>
</html>
